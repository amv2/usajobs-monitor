# Sample profile: financial management, budget and performance roles in the
# Washington, DC area, for a federal employee with competitive status.
# Copy it somewhere outside the repo, edit, then:
#   usajobs-monitor check-config --config path/to/your.toml
# Credentials come from USAJOBS_EMAIL and USAJOBS_API_KEY, never this file.

version = 1

[paths]
reports_dir    = "reports"
decisions_file = "job_decisions.csv"

[profile]
current_agency       = ""   # your agency's name, if you are a federal employee
current_agency_terms = []   # how postings name it, e.g. ["Department of Example", "DOE-X"]

[search]
locations = [
  "Washington, District of Columbia",
  "Arlington, Virginia",
  "Alexandria, Virginia",
  "Bethesda, Maryland",
  "Rockville, Maryland",
  "Silver Spring, Maryland",
]
radius_miles        = 35
include_remote_jobs = false
date_posted_days    = 14
salary_query_floor  = 120000

target_role_keywords = [
  "Budget analyst",
  "Financial analyst",
  "Financial management analyst",
  "Budget execution",
  "Program analyst budget",
  "Resource management analyst",
  "Performance analyst",
  "Strategic planning analyst",
]
search_only_keywords = ["Financial management", "Funds control", "Budget formulation", "Workforce planning"]

role_title_terms = [
  "budget", "financial", "finance", "accounting", "comptroller", "resource management",
  "performance", "program analyst", "management analyst", "strategic planning",
]
target_job_series = ["0501", "0505", "0560", "1160", "0343"]

target_agencies = [
  "Department of the Treasury",
  "Securities and Exchange Commission", "SEC",
  "Federal Deposit Insurance Corporation", "FDIC",
  "Commodity Futures Trading Commission", "CFTC",
  "Office of the Comptroller of the Currency", "OCC",
]

[filters]
salary_upper_must_exceed           = 197200   # 2026 GS pay cap: only roles paying above GS-15
near_miss_upper_salary_must_exceed = 187093   # roughly top-of-GS-14 pay in DC
near_miss_min_gs_grade             = 15

mismatch_terms = [
  "physician", "radiologist", "psychiatrist", "nurse", "dentist", "pharmacist", "clinical",
  "emergency response", "hazardous materials", "law enforcement", "pilot", "air traffic",
]
mismatch_job_series = ["0602", "0610", "0620", "0660", "0680", "0083", "1811", "1895", "2181", "2152"]
excluded_job_series = ["0905", "0510", "0511"]   # attorney; accountant and auditor need 24 accounting credit hours
exclude_senior_executive = true
excluded_pay_plans       = ["EM", "EO", "LL"]    # FDIC and FHFA executive plans

[filters.watch_list]
pay_plans = ["GS", "GG"]
grades    = [15]

[eligibility]
service                 = "competitive"
has_competitive_status  = true
interchange_agency      = ""
additional_hiring_paths = []

[report]
title = "USAJOBS Financial Management Monitor"
