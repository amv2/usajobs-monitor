# usajobs-monitor sample profile
# Easiest start: `usajobs-monitor init` asks questions and writes a profile for you.
# Or copy this to usajobs-monitor.toml, edit, then run:  usajobs-monitor check-config
# Field-by-field notes: docs/CONFIG_REFERENCE.md
#
# Credentials are NOT stored here. Set them in your environment:
#   export USAJOBS_EMAIL="you@example.com"     # must match the email you registered
#   export USAJOBS_API_KEY="..."               # from https://developer.usajobs.gov/apirequest/

version = 1

[paths]
# Relative paths resolve against this file's folder.
reports_dir    = "reports"              # briefing, tracker, last_run.json, history
decisions_file = "job_decisions.csv"    # your applied / not_interested / watching marks
resume_folder  = ""                     # optional; PDFs here are listed in the briefing

[profile]
current_agency       = "Department of Example"   # "" if you are not a federal employee
current_agency_terms = ["Department of Example", "DOE-X"]  # how postings name your agency

[search]
locations           = ["Washington, District of Columbia", "Arlington, Virginia", "Bethesda, Maryland"]
radius_miles        = 35
include_remote_jobs = false
date_posted_days    = 14
salary_query_floor  = 120000   # sent to USAJOBS; drops low-paying postings before download

# Each keyword is searched in each location. These also count toward relevance.
target_role_keywords = [
  "Budget analyst",
  "Financial management analyst",
  "Budget execution",
  "Program analyst budget",
]
# Searched to widen the net, but NOT counted as relevance (often boilerplate).
search_only_keywords = ["Financial management", "Funds control"]

# Relevance signals. A posting needs at least one of: a title term,
# a target series, or a target_role_keyword in its text.
role_title_terms  = ["budget", "financial", "finance", "accounting", "program analyst"]
target_job_series = ["0501", "0560", "0343"]

# Postings from these agencies rank higher. They are not a filter.
target_agencies = ["Department of the Treasury", "Securities and Exchange Commission", "SEC"]

# Pay: name the GS grade you want and your OPM locality pay area. The dollar
# floors are computed from OPM's pay table for that area (bundled with the tool).
# Run `usajobs-monitor pay-table` to list areas and `check-config` to see the floors.
[target]
grade    = 14
locality = "Washington-Baltimore-Arlington"   # a code like "DCB" or a name like "Seattle"
# match  = "at_grade"      # default: GS-14 postings, or other pay plans paying more than GS-13 can
#                          # "above_grade": only postings paying more than GS-14 can
# year   = 2026            # default: the newest bundled table

[filters]
# Optional: dollar floors you set here override the [target] values.
# salary_upper_must_exceed           = 158322   # a match's posted upper salary must be above this
# near_miss_upper_salary_must_exceed = 133142   # near misses must top out above this (0 = no floor)
# near_miss_min_gs_grade             = 13       # GS/GG/GM/GL near misses must reach this grade
# min_gs_grade                       = 14       # GS/GG/GM/GL matches must reach this grade

# Exclusions (hard no: never shown as matches or near misses)
mismatch_terms       = ["physician", "nurse", "pharmacist", "clinical", "law enforcement", "pilot"]
mismatch_job_series  = ["0602", "0610", "0660", "1811", "2152"]
excluded_job_series  = ["0510", "0511"]   # dropped only if EVERY listed series is excluded
exclude_senior_executive = true           # SES, SL, ST and equivalents (built-in list)
excluded_pay_plans   = []                 # extra pay plans to treat as executive, e.g. ["EM", "EO", "LL"]

# Optional overrides. Leave out to use the built-in lists.
# temporary_terms        = ["temporary promotion", "not to exceed", "term appointment", "detail assignment"]
# senior_executive_terms = ["senior executive service", "executive director", "deputy director"]

# Watch list: relevant postings at these pay plans and grades that failed ONLY the pay rule.
# With match = "above_grade" the target fills this in for you.
[filters.watch_list]
pay_plans = ["GS", "GG"]
grades    = [13]

[eligibility]
# Applicant types fill in the keys below; anything you set yourself wins. Any of:
# "public", "competitive-fed", "excepted-fed", "veteran", "military-spouse",
# "student", "recent-graduate", "reinstatement", "disability"
# presets = ["competitive-fed", "veteran"]
service                 = "competitive"   # "competitive" | "excepted" | "none"
has_competitive_status  = true
interchange_agency      = ""              # excepted-service agency with an OPM interchange agreement
additional_hiring_paths = []              # e.g. ["vet", "mspouse", "fed-transition"]

[report]
title = "USAJOBS Job Monitor"
formats = ["html", "csv"]   # also "docx" (Word briefing) and "xlsx" (Excel tracker); default ["docx", "xlsx"]

# Optional: tune ranking. These are the defaults.
# [scoring]
# keyword = 1
# title = 3
# series = 2
# target_agency = 5
# above_salary_rule = 2
# pay_high = 2
# pay_mid = 1
# pay_tier_high = 185000
# pay_tier_mid = 155000

# Optional: deliver results. Add a table per channel. Secrets (SMTP password,
# webhook URLs, ntfy topic) come only from environment variables; see the README.
# [delivery]
# notify_on_failure = true      # short notice, no attachments, when a run fails
#
# [delivery.email]
# smtp_host    = "smtp.example.com"
# security     = "ssl"          # "ssl" (465) or "starttls" (587)
# username     = "you@example.com"
# to_addresses = ["you@example.com"]
# # password from USAJOBS_SMTP_PASSWORD
#
# [delivery.discord]            # webhook from USAJOBS_DISCORD_WEBHOOK_URL
# [delivery.slack]              # webhook from USAJOBS_SLACK_WEBHOOK_URL
# [delivery.ntfy]               # topic from USAJOBS_NTFY_TOPIC
# server = "https://ntfy.sh"

# Optional AI add-on (pip install "usajobs-monitor[ai]"): resume fit notes for
# each match. Your resume is never sent unless send_resume = true. docs/AI.md
# explains each provider and what it needs. Pick one provider line:
# [ai]
# resume      = "resume.md"   # .md, .txt, .docx or .pdf, or a folder of versions
# send_resume = true
# fit_notes   = true
# rank        = true          # stronger fits first; nothing is hidden
#
# provider = "claude-cli"     # Claude subscription, through the Claude Code CLI
# provider = "codex-cli"      # ChatGPT plan, through the OpenAI Codex CLI
# provider = "gemini-cli"     # Google account, through the Gemini CLI
# provider = "ollama"         # local model, nothing leaves your computer
# model    = "llama3.1"       #   (ollama needs a model; the others have defaults)
# provider = "anthropic"      # Claude API key in ANTHROPIC_API_KEY (pay per use)
#
# All but "anthropic" also need, outside this file:
#   export USAJOBS_ALLOW_AI_PROVIDER=claude-cli   (the provider's name)
